name: Standings + deploy

on:
  schedule:
    # ▼▼ STANDINGS SCHEDULE: the one line to change (times are UTC) ▼▼
    - cron: "17 10 * * *"        # daily, 10:17 UTC (6:17 AM ET), after the night's games. Weekly (Mondays): "17 10 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only test the standings feeds (don't save)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/scoring.test.js tests/teams.test.js tests/fetch.test.js

  # Runs on the schedule, on "Run workflow", and on every push (so a code change also refreshes standings).
  standings:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch standings
        # On a push, a feed outage must not block publishing the code change.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: node scripts/fetch-standings.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit standings.json
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "standings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standings.json
          git commit -m "Update standings" && git push || echo "Nothing to commit"

  deploy:
    needs: [test, standings]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.standings.result != 'failure' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js standings.json _site/

      # Main site: Firebase Hosting (https://season-wins.web.app). Needs the FIREBASE_SERVICE_ACCOUNT secret.
      - name: Deploy to Firebase Hosting
        id: firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret yet; GitHub Pages keeps serving the full site."
            echo "live=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting --project season-wins --non-interactive
          echo "live=true" >> "$GITHUB_OUTPUT"

      # Old address (GitHub Pages): forwards to the new one once Firebase Hosting is live.
      - name: Pick GitHub Pages content
        run: |
          if [ "${{ steps.firebase.outputs.live }}" = "true" ]; then rm -rf _site && cp -r redirect _site; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
